<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mansur.ai ~ Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="terminal">
    <div id="output"></div>
    <div id="input-line">
      <span id="prompt">mansur.ai:~$</span>
      <input type="text" id="input" autofocus spellcheck="false" autocomplete="off" />
    </div>
  </div>

  <div id="key-modal" class="modal hidden">
    <div class="modal-content">
      <h2>🔑 API Key Required</h2>
      <p>Enter your Groq API key to start chatting with Mansur.ai.</p>
      <p class="hint">Your key is stored locally in your browser and never sent anywhere except Groq's API.</p>
      <input type="password" id="key-input" placeholder="gsk_..." spellcheck="false" autocomplete="off" />
      <button id="key-submit">Connect</button>
      <p class="error" id="key-error"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
